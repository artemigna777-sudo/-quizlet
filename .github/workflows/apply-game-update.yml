name: Apply game update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-game-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified patch
        run: |
          curl -fsSL 'https://tmpfiles.org/dl/1795207541.96bcf96fc2928a43/wMAibbcwZ3Wq/erased-city-map-and-pet.patch' -o update.patch
          echo '941a8d088d8827beaa41affc387530e22cdbca5b3fe378b02a292b72d6c28b47  update.patch' | sha256sum -c -

      - name: Apply and publish
        run: |
          git am update.patch
          git push origin main
