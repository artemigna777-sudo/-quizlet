name: Apply game update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-game-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified patch
        run: |
          curl -fsSL 'https://files.catbox.moe/agtp5o.patch' -o update.patch
          echo '941a8d088d8827beaa41affc387530e22cdbca5b3fe378b02a292b72d6c28b47  update.patch' | sha256sum -c -

      - name: Apply and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am update.patch
          git push origin HEAD:main
